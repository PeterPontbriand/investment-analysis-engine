old = "from investment_analysis_engine.evaluation.models import Case\n"
new = '''from investment_analysis_engine.evaluation.cases.ci_probe import CI_PROBE_ARGUMENTS, CIP_01
from investment_analysis_engine.evaluation.models import Case
'''
