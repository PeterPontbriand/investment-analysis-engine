# The reviewed edits a contributor makes by hand to existing files after the generator has run, for the throwaway
# strategy `ci_probe` (label "CI Probe"). Each patch is applied to `path`, which is relative to the copy of the
# repository, and must match exactly `count` times: an anchor that moved fails the end-to-end test instead of
# silently skipping the edit. A patched Python file is then fixed and formatted by Ruff, so a patch need not
# order its imports or wrap its lines.
#
# An anchor quotes structural text only: the line that opens or closes a tuple together with the definition that
# follows it, or a definition's name that no strategy owns. It never quotes an entry that a real strategy or a
# Golden case adds (a tuple's last entry, a case id, a strategy's import line, a version or a case count), so adding
# either needs no edit in this file.
#
# A patch is one of two kinds:
#
# - `old` and `new`: replace the literal text `old` with `new`.
# - `bump`: a regular expression with one capture group that holds an integer. Each match has that integer replaced by
#   its successor, read from the file as it stands, so the patch names the constant or the assertion it moves and
#   never its current value. The suite version and the case counts that a Golden case moves are bumped this way.

