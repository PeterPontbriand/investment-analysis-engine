# The tests of the conformance files that pin the four production strategies, deselected from the end-to-end test's
# run of the copy and listed in the pins plan. `node` is the pytest node id, `kind` is `accidental` (it pins the four
# strategies where it could read STRATEGIES, ToolName or the tiers) or `reviewed` (content a new strategy writes by
# hand), and `pins` says what it pins. The end-to-end test fails if a node id no longer exists, or if the test
# passes in the copy.

