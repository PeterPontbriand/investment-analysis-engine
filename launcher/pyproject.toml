[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ian-launcher"
version = "0.1.0"
description = "The ian command: runs the installation of Investment Analysis Engine it was installed from."
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ian = "ian_launcher:main"

[tool.setuptools]
py-modules = ["ian_launcher"]
