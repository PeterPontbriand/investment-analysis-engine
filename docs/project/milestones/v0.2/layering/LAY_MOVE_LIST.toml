serves = "L7"
destination = "src/workspace_documents/json_documents.py"

# --- Target units: the text of the Owns column of the target package table. -------------------------------

[[unit]]
name = "core"
owns = "The shared clock, result and status types, strategy errors, constants, stable failure codes and their classifier, and the trajectory event model."

[[unit]]
name = "tools"
owns = "The tool registry, tool-argument schema generation, and parsing of tool calls from model output."

[[unit]]
name = "config"
owns = "The application settings object and its environment and profile loading, with the reliability-limits and schema-configuration shapes it holds and the path validation it uses."

[[unit]]
name = "data"
owns = "Provider contracts and adapters, financial-fact provenance and resolution, instrument identity and profiles, and the SQLite database layer with the provider-data and cache repositories."

[[unit]]
name = "llm"
owns = "The local-model client."

[[unit]]
name = "schema"
owns = "The structured-output schema constraint and its validation of model output."

[[unit]]
name = "utils"
owns = "Logging setup."

[[unit]]
name = "analysis"
owns = "The analyzer and analysis-context contract, the strategy-neutral financial-resolution helpers, the selection base and the run-outcome models."

[[unit]]
name = "telemetry"
owns = "Trajectory telemetry: the recorder, its sinks, redaction, run context and data-quality events."

[[unit]]
name = "orchestrator"
owns = "The LLM tool-selection loop, the tool dispatcher and reliability policy, the registration of analysis-tool handlers, and the shared base for tool arguments and handlers."

[[unit]]
name = "reporting"
owns = "The presentation helpers the strategy presenters share, the typed models of the shared and failure `--json` documents, and the failure envelope."

[[unit]]
name = "strategies"
owns = "One package per analysis strategy with its analyzer, configuration, result, selection, tool, presenter, codec, replay projector and document model, plus shared strategy code. The `cli`, `evaluation` and `execution` files of each package belong to the `cli`, `evaluation` and `workspace` units."

[[unit]]
name = "workspace"
owns = "The closed selection and native-evidence unions, analysis requests, run capture, watchlists, refresh, the run and watchlist repositories, and each strategy's `execution` file."

[[unit]]
name = "strategy_wiring"
owns = "The closed, statically declared list of supported strategies and their shared wiring."

[[unit]]
name = "workspace_documents"
owns = "Saved-run replay and the typed refresh, runs and watchlist documents, with the table of all published `--json` documents."

[[unit]]
name = "evaluation"
owns = "The Golden case catalog, deterministic evaluator, fixtures and evaluation reporting, plus each strategy's `evaluation` file."

[[unit]]
name = "cli"
owns = "The Typer commands, their production wiring and the process entry point, plus each strategy's `cli` file."
