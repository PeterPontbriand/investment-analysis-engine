# The move list of the package layering work: every file and every top-level name that changes unit.
#
# Read by scripts/simulate_package_layers.py (`py -3 -m scripts.simulate_package_layers`). The target the
# script reports is today's code with every entry below applied, so a slice deletes its entries in the change
# that makes the moves; a test fails for an entry whose source no longer exists. `serves` names the decision in
# LAY_DESIGN.md that the entry carries out. `destination` is the recommended path after the move; it fixes which
# package initializers the moved file depends on. The destination names marked "decision" in LAY_DESIGN.md §8
# are the recommendations, not settled.

# --- Role rule (L5): three role files of each strategy package belong to the layer they adapt it to. --------
# No file moves for this rule; only the unit the dependency check assigns to the file changes.

[[role_rule]]
under = "src/strategies"
roles = { cli = "cli", evaluation = "evaluation", execution = "workspace" }

# --- L2: trajectory telemetry leaves `core`; the plain event model stays. ------------------------------------

[[file]]
path = "src/core/telemetry/__init__.py"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/__init__.py"

[[file]]
path = "src/core/telemetry/recorder.py"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/recorder.py"

[[file]]
path = "src/core/telemetry/quality.py"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/quality.py"

[[file]]
path = "src/core/telemetry/redaction.py"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/redaction.py"

[[file]]
path = "src/core/telemetry/run_context.py"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/run_context.py"

[[file]]
path = "src/core/telemetry/sinks/__init__.py"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/sinks/__init__.py"

[[file]]
path = "src/core/telemetry/sinks/base.py"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/sinks/base.py"

[[file]]
path = "src/core/telemetry/sinks/jsonl.py"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/sinks/jsonl.py"

[[file]]
path = "src/core/telemetry/sinks/sqlite.py"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/sinks/sqlite.py"

[[file]]
path = "src/core/telemetry/models.py"
unit = "core"
serves = "L2"
destination = "src/core/trajectory_events.py"

[[name]]
path = "src/orchestrator/reliability.py"
name = "RecentEventSummary"
unit = "telemetry"
serves = "L2"
destination = "src/telemetry/recent_events.py"

# --- L3: `config` becomes a package holding the settings shapes and the path helper it borrows. ----------------

[[file]]
path = "src/config.py"
unit = "config"
serves = "L3"
destination = "src/config/__init__.py"

[[name]]
path = "src/orchestrator/reliability.py"
name = "ReliabilityLimits"
unit = "config"
serves = "L3"
destination = "src/config/reliability_limits.py"

[[name]]
path = "src/schema/config.py"
name = "SchemaConfig"
unit = "config"
serves = "L3"
destination = "src/config/schema_config.py"

[[file]]
path = "src/utils/paths.py"
unit = "config"
serves = "L3"
destination = "src/config/paths.py"

# --- L4: the analysis-run and watchlist repositories move to the workspace side. ----------------------------

[[file]]
path = "src/data/repositories/analysis_runs.py"
unit = "workspace"
serves = "L4"
destination = "src/workspace/repositories/analysis_runs.py"

[[file]]
path = "src/data/repositories/watchlists.py"
unit = "workspace"
serves = "L4"
destination = "src/workspace/repositories/watchlists.py"

# --- L6: the workspace modules strategy core files depend on move beside the analyzer contract. -------------

[[file]]
path = "src/workspace/selection_base.py"
unit = "analysis"
serves = "L6"
destination = "src/analysis/selection_base.py"

[[file]]
path = "src/workspace/models.py"
unit = "analysis"
serves = "L6"
destination = "src/analysis/run_models.py"

# --- L7: saved-run replay and the refresh, runs and watchlist documents move up to the workspace side. ------

[[file]]
path = "src/reporting/analysis_runs.py"
unit = "workspace_documents"
serves = "L7"
destination = "src/workspace_documents/analysis_runs.py"

[[file]]
path = "src/reporting/documents/refresh.py"
unit = "workspace_documents"
serves = "L7"
destination = "src/workspace_documents/refresh.py"

[[file]]
path = "src/reporting/documents/runs.py"
