name: Continuous Integration

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  markdown-checks:
    name: Check Markdown links and sequence tables
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check Markdown Links and Anchors
        run: python scripts/check_doc_links.py

      - name: Check Planning Sequence Tables
        run: python scripts/check_sequence_tables.py

  quality-and-test:
    name: Validate on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.os }}

    env:
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - name: Check out Repository Code
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Project and Dependencies
        run: uv sync --frozen

      - name: Verify Python ${{ matrix.python-version }} is the interpreter under test
        shell: bash
        run: uv run python -c "import sys; want='${{ matrix.python-version }}'; got='%d.%d' % sys.version_info[:2]; print(sys.version); assert got == want, f'expected {want}, got {got}'"

      - name: Enforce Code Formatting (Ruff)
        run: uv run ruff format --check .

      - name: Enforce Linting Rules (Ruff)
        run: uv run ruff check .

      - name: Enforce Static Type Safety (MyPy)
        run: uv run mypy --strict src tests scripts

      - name: Execute Cross-Platform Test Suite with Coverage
        run: uv run pytest
